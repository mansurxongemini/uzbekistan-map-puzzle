<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>O'zbekiston Puzzle - Responsive</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;900&display=swap');
        
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #ffffff;
            /* Mobil qurilmalarda scroll bo'lishi mumkin, lekin desktopda yashiramiz */
            overflow-x: hidden;
        }

        /* 3D Button Effect */
        .team-btn {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            top: 0;
            border-bottom-width: 4px; /* Mobilda ingichkaroq */
        }
        @media (min-width: 768px) {
            .team-btn { border-bottom-width: 8px; }
        }

        .team-btn:active {
            top: 4px;
            border-bottom-width: 0px;
            transform: translateY(2px);
        }

        /* Active State Animation */
        .team-btn.active {
            background: #16a34a;
            color: white;
            border-color: #14532d;
            transform: scale(1.02);
            box-shadow: 0 0 15px rgba(34, 197, 94, 0.6);
        }
        @media (min-width: 768px) {
            .team-btn.active { transform: scale(1.05); box-shadow: 0 0 30px rgba(34, 197, 94, 0.6); }
        }

        /* Check Button Animation */
        .check-btn { transition: transform 0.2s; }
        .check-btn:active { transform: scale(0.9); }

        /* Map Image Styles */
        .map-image-contain {
            object-fit: contain;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.15));
        }

        /* Animations */
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-slide-in {
            animation: slideIn 0.5s ease-out forwards;
        }

        .bg-grid {
            background-image: radial-gradient(#e5e7eb 2px, transparent 2px);
            background-size: 30px 30px;
        }
    </style>
</head>
<body class="min-h-screen w-full flex flex-col bg-white bg-grid">

    <!-- HEADER QISMI -->
    <header class="w-full py-2 md:py-0 md:h-[12vh] flex flex-row justify-between items-center px-4 md:px-12 border-b-2 md:border-b-4 border-gray-100 bg-white/95 backdrop-blur-sm sticky top-0 z-20 shadow-sm md:shadow-none">
        <div>
            <h1 class="text-lg md:text-4xl font-black text-blue-900 tracking-widest uppercase leading-tight">PUZZLE MAP</h1>
            <p class="text-[10px] md:text-xl text-gray-400 font-bold hidden md:block mt-1">O'zbekiston bo'ylab sayohat</p>
        </div>
        
        <!-- Savol Hisoblagich -->
        <div class="flex items-center gap-2 md:gap-4 bg-blue-50 px-3 py-1 md:px-8 md:py-4 rounded-xl md:rounded-2xl border md:border-2 border-blue-100">
            <span class="text-sm md:text-3xl text-blue-800 font-bold uppercase mr-1">Savol:</span>
            <div class="flex items-end baseline">
                <span id="question-counter" class="text-2xl md:text-6xl font-black text-blue-600 leading-none">1</span>
                <span class="text-sm md:text-4xl text-gray-400 font-bold">/14</span>
            </div>
        </div>
    </header>

    <!-- ASOSIY QISM -->
    <main id="game-screen" class="flex-1 w-full flex flex-col items-center justify-between p-4 md:p-8 relative overflow-y-auto">
        
        <!-- Savol Matni -->
        <h2 class="text-2xl md:text-5xl lg:text-6xl font-extrabold text-gray-800 text-center mb-2 md:mb-4 mt-2 drop-shadow-sm leading-tight">
            Bu qaysi hudud?
        </h2>

        <!-- Xarita Rasmi Container -->
        <div class="flex-1 w-full flex items-center justify-center relative my-2 md:my-4 min-h-[30vh] md:min-h-0">
            <!-- Rasm -->
            <img 
                id="region-image" 
                src="" 
                alt="Hudud Rasmi" 
                class="h-auto w-full max-h-[40vh] md:max-h-[50vh] lg:max-h-[55vh] map-image-contain transition-transform duration-700"
            >
            
            <!-- Javob Overlay -->
            <div id="region-name-overlay" class="absolute bottom-4 md:bottom-10 bg-white/95 backdrop-blur-md px-6 py-3 md:px-12 md:py-6 rounded-2xl md:rounded-3xl border-2 md:border-4 border-blue-500 shadow-xl hidden animate-slide-in transform translate-y-4 md:translate-y-10 max-w-[90%] text-center z-10">
                <h2 id="region-name-display" class="text-xl md:text-5xl lg:text-6xl font-black text-blue-900 tracking-wide uppercase break-words">Hudud Nomi</h2>
            </div>
        </div>

        <!-- PASTKI BOSHQARUV PANELI -->
        <div class="w-full flex flex-col gap-4 md:gap-6 justify-end pb-2 md:pb-4 mt-4">
            
            <!-- 1. JAMOA TANLASH (Responsive Grid) -->
            <div class="grid grid-cols-4 gap-3 md:gap-8 w-full md:px-12">
                <button onclick="manualSelect(1)" id="btn-1" class="team-btn h-14 md:h-24 lg:h-32 bg-gray-100 border-gray-300 rounded-xl md:rounded-3xl text-2xl md:text-5xl lg:text-6xl font-black text-gray-600 shadow-md hover:bg-white flex items-center justify-center">1</button>
                <button onclick="manualSelect(2)" id="btn-2" class="team-btn h-14 md:h-24 lg:h-32 bg-gray-100 border-gray-300 rounded-xl md:rounded-3xl text-2xl md:text-5xl lg:text-6xl font-black text-gray-600 shadow-md hover:bg-white flex items-center justify-center">2</button>
                <button onclick="manualSelect(3)" id="btn-3" class="team-btn h-14 md:h-24 lg:h-32 bg-gray-100 border-gray-300 rounded-xl md:rounded-3xl text-2xl md:text-5xl lg:text-6xl font-black text-gray-600 shadow-md hover:bg-white flex items-center justify-center">3</button>
                <button onclick="manualSelect(4)" id="btn-4" class="team-btn h-14 md:h-24 lg:h-32 bg-gray-100 border-gray-300 rounded-xl md:rounded-3xl text-2xl md:text-5xl lg:text-6xl font-black text-gray-600 shadow-md hover:bg-white flex items-center justify-center">4</button>
            </div>

            <!-- 2. HARAKAT TUGMALARI -->
            <div class="flex flex-col md:flex-row justify-between items-center gap-3 md:gap-0 md:px-12 mt-2 w-full">
                
                <!-- Javobni Ko'rsatish -->
                <button onclick="showAnswer()" id="show-answer-btn" class="w-full md:w-auto md:flex-1 md:max-w-md h-12 md:h-20 lg:h-24 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl md:rounded-2xl text-lg md:text-2xl lg:text-3xl font-bold shadow-lg transition transform active:scale-95 flex items-center justify-center gap-2 md:gap-4 order-2 md:order-1">
                    <i class="fas fa-eye"></i> <span class="md:hidden">Javob</span><span class="hidden md:inline">JAVOBNI KO'RSATISH</span>
                </button>

                <!-- Check va O'tkazish -->
                <div class="flex w-full md:w-auto gap-3 md:gap-6 justify-between md:justify-end order-1 md:order-2">
                    <button onclick="skipQuestion()" class="flex-1 md:flex-none h-14 md:h-20 lg:h-24 px-4 md:px-8 text-gray-400 hover:text-red-500 font-bold text-sm md:text-2xl transition flex items-center justify-center gap-2 rounded-xl md:rounded-2xl bg-gray-50 md:bg-transparent border md:border-0 border-gray-200">
                        O'tkazish <i class="fas fa-forward"></i>
                    </button>

                    <button onclick="submitAnswer()" class="check-btn h-14 w-14 md:h-20 md:w-20 lg:h-24 lg:w-24 bg-green-500 text-white rounded-full shadow-lg flex items-center justify-center text-2xl md:text-4xl lg:text-5xl border-2 md:border-4 border-green-200 ring-2 md:ring-4 ring-green-100 flex-shrink-0">
                        <i class="fas fa-check"></i>
                    </button>
                </div>
            </div>
        </div>
    </main>

    <!-- NATIJALAR OYNASI -->
    <div id="result-screen" class="hidden fixed inset-0 bg-white z-50 flex flex-col items-center justify-center p-4 md:p-12 overflow-y-auto">
        <div class="w-full max-w-7xl flex flex-col items-center h-full justify-center py-4 md:py-10">
            
            <div class="text-center mt-8 md:mt-0">
                <i class="fas fa-trophy text-yellow-400 text-6xl md:text-9xl drop-shadow-xl mb-2 md:mb-6 animate-bounce"></i>
                <h2 class="text-3xl md:text-7xl font-black text-blue-900 mb-2 md:mb-4">O'YIN TUGADI!</h2>
                <p class="text-sm md:text-3xl text-gray-500">Barcha 14 ta hudud o'rganildi.</p>
            </div>
            
            <!-- Xarita -->
            <div class="w-full flex items-center justify-center p-4 md:p-8 my-4">
                <img src="https://gadm.org/img/480/gadm/UZB/UZB_labs.png" class="h-auto w-full max-h-[30vh] md:max-h-[40vh] object-contain drop-shadow-2xl" alt="O'zbekiston Xaritasi">
            </div>

            <!-- Natijalar Jadvali -->
            <div class="grid grid-cols-2 md:grid-cols-4 gap-3 md:gap-8 w-full mb-8">
                <!-- 1-Jamoa -->
                <div class="bg-blue-50 p-4 md:p-8 rounded-2xl md:rounded-3xl border-t-4 md:border-t-8 border-blue-600 flex flex-col items-center shadow-lg">
                    <span class="text-xs md:text-2xl font-bold text-gray-500 uppercase tracking-widest mb-1 md:mb-2">1-Jamoa</span>
                    <span class="text-3xl md:text-7xl font-black text-blue-700" id="score-1">0</span>
                </div>
                <!-- 2-Jamoa -->
                <div class="bg-red-50 p-4 md:p-8 rounded-2xl md:rounded-3xl border-t-4 md:border-t-8 border-red-600 flex flex-col items-center shadow-lg">
                    <span class="text-xs md:text-2xl font-bold text-gray-500 uppercase tracking-widest mb-1 md:mb-2">2-Jamoa</span>
                    <span class="text-3xl md:text-7xl font-black text-red-700" id="score-2">0</span>
                </div>
                <!-- 3-Jamoa -->
                <div class="bg-yellow-50 p-4 md:p-8 rounded-2xl md:rounded-3xl border-t-4 md:border-t-8 border-yellow-500 flex flex-col items-center shadow-lg">
                    <span class="text-xs md:text-2xl font-bold text-gray-500 uppercase tracking-widest mb-1 md:mb-2">3-Jamoa</span>
                    <span class="text-3xl md:text-7xl font-black text-yellow-600" id="score-3">0</span>
                </div>
                <!-- 4-Jamoa -->
                <div class="bg-green-50 p-4 md:p-8 rounded-2xl md:rounded-3xl border-t-4 md:border-t-8 border-green-600 flex flex-col items-center shadow-lg">
                    <span class="text-xs md:text-2xl font-bold text-gray-500 uppercase tracking-widest mb-1 md:mb-2">4-Jamoa</span>
                    <span class="text-3xl md:text-7xl font-black text-green-700" id="score-4">0</span>
                </div>
            </div>

            <button onclick="location.reload()" class="w-full md:w-auto px-8 md:px-16 py-4 md:py-6 bg-gray-900 text-white rounded-xl md:rounded-3xl hover:bg-black transition font-bold shadow-2xl flex items-center justify-center gap-2 md:gap-4 text-xl md:text-3xl mb-8">
                <i class="fas fa-redo-alt"></i> Qayta Boshlash
            </button>
        </div>
    </div>

    <script>
        // MA'LUMOTLAR BAZASI
        const regions = [
            { name: "Andijon viloyati", image: "https://gadm.org/img/480/gadm/UZB/andijon/UZB_andijon.png" },
            { name: "Buxoro viloyati", image: "https://gadm.org/img/480/gadm/UZB/bukhoro/UZB_bukhoro.png" },
            { name: "Farg'ona viloyati", image: "https://gadm.org/img/480/gadm/UZB/ferghana/UZB_ferghana.png" },
            { name: "Jizzax viloyati", image: "https://gadm.org/img/480/gadm/UZB/jizzakh/UZB_jizzakh.png" },
            { name: "Xorazm viloyati", image: "https://gadm.org/img/480/gadm/UZB/khorezm/UZB_khorezm.png" },
            { name: "Namangan viloyati", image: "https://gadm.org/img/480/gadm/UZB/namangan/UZB_namangan.png" },
            { name: "Navoiy viloyati", image: "https://gadm.org/img/480/gadm/UZB/navoi/UZB_navoi.png" },
            { name: "Qashqadaryo viloyati", image: "https://gadm.org/img/480/gadm/UZB/kashkadarya/UZB_kashkadarya.png" },
            { name: "Qoraqalpog'iston Respublikasi", image: "https://gadm.org/img/480/gadm/UZB/karakalpakstan/UZB_karakalpakstan.png" },
            { name: "Samarqand viloyati", image: "https://gadm.org/img/480/gadm/UZB/samarkand/UZB_samarkand.png" },
            { name: "Sirdaryo viloyati", image: "https://gadm.org/img/480/gadm/UZB/sirdaryo/UZB_sirdaryo.png" },
            { name: "Surxondaryo viloyati", image: "https://gadm.org/img/480/gadm/UZB/surkhandarya/UZB_surkhandarya.png" },
            { name: "Toshkent viloyati", image: "https://gadm.org/img/480/gadm/UZB/tashkent/UZB_tashkent.png" },
            { name: "Toshkent shahri", image: "https://gadm.org/img/480/gadm/UZB/tashkentcity/UZB_tashkentcity.png" }
        ];

        // O'YIN STATE
        let currentQuestionIndex = 0;
        let activeTeam = 1;
        let scores = { 1: 0, 2: 0, 3: 0, 4: 0 };
        let turnQueue = []; 

        // Elementlar
        const questionCounterEl = document.getElementById('question-counter');
        const regionNameDisplayEl = document.getElementById('region-name-display');
        const regionImageEl = document.getElementById('region-image');
        const regionNameOverlayEl = document.getElementById('region-name-overlay');
        const gameScreen = document.getElementById('game-screen');
        const resultScreen = document.getElementById('result-screen');
        const showAnswerBtn = document.getElementById('show-answer-btn');

        initGame();

        function initGame() {
            shuffleArray(regions);
            currentQuestionIndex = 0;
            activeTeam = null;
            updateQuestionUI();
            setNextRandomTeam();
        }

        function setNextRandomTeam() {
            if (turnQueue.length === 0) {
                turnQueue = [1, 2, 3, 4];
                shuffleArray(turnQueue);

                if (activeTeam !== null && turnQueue[turnQueue.length - 1] === activeTeam) {
                    [turnQueue[0], turnQueue[turnQueue.length - 1]] = 
                    [turnQueue[turnQueue.length - 1], turnQueue[0]];
                }
            }
            const nextTeam = turnQueue.pop();
            highlightTeam(nextTeam);
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function highlightTeam(teamId) {
            activeTeam = teamId;
            document.querySelectorAll('.team-btn').forEach(btn => btn.classList.remove('active'));
            const activeBtn = document.getElementById(`btn-${teamId}`);
            if (activeBtn) activeBtn.classList.add('active');
        }

        function manualSelect(teamId) {
            highlightTeam(teamId);
        }

        function showAnswer() {
            const currentRegion = regions[currentQuestionIndex];
            regionNameDisplayEl.innerText = currentRegion.name;
            
            regionNameOverlayEl.classList.remove('hidden');
            regionNameOverlayEl.classList.add('flex');
            regionNameOverlayEl.classList.add('animate-slide-in');
            
            showAnswerBtn.classList.add('opacity-50', 'cursor-not-allowed');
            showAnswerBtn.disabled = true;
        }

        function submitAnswer() {
            if (activeTeam !== null) {
                scores[activeTeam] += 100;
            }
            nextQuestion();
        }

        function skipQuestion() {
            nextQuestion();
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < regions.length) {
                resetAnswerUI();
                updateQuestionUI();
                setNextRandomTeam(); 
            } else {
                finishGame();
            }
        }

        function resetAnswerUI() {
            regionNameOverlayEl.classList.add('hidden');
            regionNameOverlayEl.classList.remove('flex');
            regionNameOverlayEl.classList.remove('animate-slide-in');
            
            showAnswerBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            showAnswerBtn.disabled = false;
        }

        function updateQuestionUI() {
            questionCounterEl.innerText = currentQuestionIndex + 1;
            const currentRegion = regions[currentQuestionIndex];
            regionImageEl.src = currentRegion.image;
        }

        function finishGame() {
            gameScreen.classList.add('hidden');
            document.querySelector('header').classList.add('hidden');
            resultScreen.classList.remove('hidden');
            resultScreen.classList.add('flex');

            document.getElementById('score-1').innerText = scores[1];
            document.getElementById('score-2').innerText = scores[2];
            document.getElementById('score-3').innerText = scores[3];
            document.getElementById('score-4').innerText = scores[4];
        }
    </script>
</body>
</html>
